<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Ayobamps University</title>
</head>
<body>

    <h1>Ayobamps University Student Management System</h1>
    <h2>Student Registration Form</h2>

<nav>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="students.html">Students</a></li>
        <li><a href="register.html">Register Student</a></li>
        <li><a href="student-details.html">Student Details</a></li>
    </ul>
</nav>

    <main>
        <form>
            <!-- Registration Form -->
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name">
            <br><br>

            <!-- Date of Birth -->
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
            <br><br>

            <!-- Gender -->
            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <br><br>

            <!-- Email -->
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address">
            <br><br>

            <!-- Phone Number -->
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
            <br><br>

            <!-- Home Address -->
            <label for="address">Home Address:</label>
            <input type="text" id="address" name="address" placeholder="Enter your address">
            <br><br>

            <!-- Department -->
            <label for="department">Department:</label>
            <select id="department" name="department">
                <option value="">Select Department</option>
                <option>Computer Science</option>
                <option>Engineering</option>
                <option>Business Administration</option>
                <option>Health Sciences</option>
                <option>Mass Communication</option>
            </select>
            <br><br>

            <!-- Course -->
            <label for="course">Course:</label>
            <select id="course" name="course">
                <option value="">Select Course</option>
                <option>Web Development</option>
                <option>Software Engineering</option>
                <option>Cyber Security</option>
                <option>Data Science</option>
            </select>
            <br><br>

            <!-- Student Photograph -->
            <label for="photo">Student Photograph:</label>
            <input type="file" id="photo" name="photo" accept="image/*">
            <br><br>

            <!-- Submit and Reset Buttons -->
            <input type="submit" value="Register Student">
            <input type="reset" value="Clear Form">
        </form>

        <p><a href="students.html">Back to Students</a></p>
    </main>

</body>
</html>
